name: Atualizar dados

on:
  schedule:
    - cron: "0 * * * *"      # a cada hora (horário UTC)
  workflow_dispatch:          # permite rodar manualmente pelo botão

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Rodar o script
        run: python teste.py    # troque pelo arquivo que gera o dados.json

      - name: Enviar dados.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados.json
          git diff --cached --quiet || git commit -m "Atualiza dados.json"
          git push
